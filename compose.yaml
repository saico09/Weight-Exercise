name: weight-exercise-local
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.75
    shm_size: 80m
    environment:
      POSTGRES_DB: weight_exercise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/start-local-cloud.ps1 first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Missing app database password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - autovacuum_work_mem=16MB
      - -c
      - autovacuum_max_workers=1
      - -c
      - max_connections=20
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_wal_size=256MB
      - -c
      - min_wal_size=80MB
      - -c
      - log_statement=none
    volumes:
      - database:/var/lib/postgresql/data
      - ./server/db/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./server/db/02-schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./server/db/05-email-summaries.sql:/docker-entrypoint-initdb.d/05-email-summaries.sql:ro
      - ./server/db/06-pro-licenses.sql:/docker-entrypoint-initdb.d/06-pro-licenses.sql:ro
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d weight_exercise']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &bounded-logs
      driver: json-file
      options: { max-size: 5m, max-file: '2' }
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    environment:
      MP_MAX_MESSAGES: 50
      MP_MAX_AGE: 24h
      MP_SMTP_MAX_MESSAGE_SIZE: 15
      MP_SMTP_MAX_RECIPIENTS: 2
    ports: ['127.0.0.1:8025:8025']
    networks: [private, local-access]
    logging: *bounded-logs
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    init: true
    mem_limit: 192m
    cpus: 0.5
    read_only: true
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    environment:
      PORT: 3001
      LOCAL_DEVELOPMENT: 'true'
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: weight_exercise
      PGUSER: we_app
      PGPASSWORD: ${APP_DB_PASSWORD:?Missing app database password}
      AUTH_SECRET: ${AUTH_SECRET:?Missing authentication secret}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174}
      SMTP_MODE: ${SMTP_MODE:-mailpit}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-access@weight-exercise.local}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://127.0.0.1:5173}
      PRO_LICENSE_ENFORCEMENT: ${PRO_LICENSE_ENFORCEMENT:-false}
      PRO_LICENSE_OFFLINE_DAYS: ${PRO_LICENSE_OFFLINE_DAYS:-7}
      PLAY_CLOUD_PROJECT_NUMBER: ${PLAY_CLOUD_PROJECT_NUMBER:-}
      PLAY_CERTIFICATE_SHA256: ${PLAY_CERTIFICATE_SHA256:-}
      PLAY_MIN_VERSION_CODE: ${PLAY_MIN_VERSION_CODE:-1}
      # Private files are supplied through a separate, untracked Compose override.
      PLAY_SERVICE_ACCOUNT_FILE: ${PLAY_SERVICE_ACCOUNT_FILE:-}
      PRO_LICENSE_SIGNING_KEY_FILE: ${PRO_LICENSE_SIGNING_KEY_FILE:-}
    ports: ['127.0.0.1:3001:3001']
    networks: [private, local-access]
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *bounded-logs
networks:
  private:
    internal: true
  local-access:
volumes:
  database:
